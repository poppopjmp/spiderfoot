services:
  agents:
    # Deploys the base image directly, same as build-spiderfoot.sh's own
    # notes describe for the production path - no separate Dockerfile of
    # its own. Depends on `docker/compose/core.yml`'s `base` service having
    # been built first (see that service's comment for the build order);
    # was previously its own independent `build:` of Dockerfile.base here,
    # which just meant building the same image twice under two different
    # names for no benefit.
    image: spiderfoot-base:latest
    container_name: sf-agents
    restart: unless-stopped
    security_opt:
    - "no-new-privileges:true"
    read_only: true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp:size=256M,mode=1777
    - /home/spiderfoot/logs:size=64M,mode=1777
    - /home/spiderfoot/data:size=128M,mode=1777
    - /home/spiderfoot/cache:size=64M,mode=1777
    - /home/spiderfoot/.spiderfoot:size=32M,mode=1777
    networks:
    - sf-frontend
    - sf-backend
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.agents.rule=PathPrefix(`/api/agents`)"
    - "traefik.http.routers.agents.entrypoints=websecure"
    - "traefik.http.routers.agents.tls=true"
    - "traefik.http.routers.agents.priority=110"
    - "traefik.http.routers.agents.service=agents"
    - "traefik.http.middlewares.agents-strip.stripprefix.prefixes=/api/agents"
    - "traefik.http.routers.agents.middlewares=agents-strip,rate-limit-api@file,security-headers@file,body-limit@file"
    - "traefik.http.services.agents.loadbalancer.server.port=8100"
    environment:
      SF_SERVICE_ROLE: agents
      SF_AGENTS_HOST: "0.0.0.0"
      SF_AGENTS_PORT: "8100"
      SF_AGENTS_WORKERS: ${SF_AGENTS_WORKERS:-1}
      SF_LOG_LEVEL: ${SF_LOG_LEVEL:-INFO}
      SF_REDIS_URL: redis://redis:6379/0
      # Needed for report_generator.py's Qdrant backfill (reads a scan's
      # events from Postgres) - was missing entirely, which silently
      # degraded every AI report back to empty/generic. See PR #393.
      SF_POSTGRES_DSN:
        postgresql://${POSTGRES_USER:-spiderfoot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spiderfoot}
      # LLM via LiteLLM proxy
      SF_LLM_PROVIDER: ${SF_LLM_PROVIDER:-mock}
      SF_LLM_API_BASE: ${SF_LLM_API_BASE:-http://litellm:4000}
      SF_LLM_API_KEY: ${SF_LLM_API_KEY}
      SF_LLM_MODEL: ${SF_LLM_MODEL:-gpt-4o-mini}
      # Qdrant vector DB for report context
      SF_QDRANT_BACKEND: "${SF_QDRANT_BACKEND:-memory}"
      SF_QDRANT_HOST: "${SF_QDRANT_HOST:-}"
      SF_QDRANT_PORT: "${SF_QDRANT_PORT:-}"
      SF_QDRANT_GRPC_PORT: "${SF_QDRANT_GRPC_PORT:-}"
      SF_QDRANT_PREFIX: "${SF_QDRANT_PREFIX:-sf_}"
      # Embedding model for semantic search (RAG context for AI reports).
      # fastembed (onnxruntime, local, no torch/API key) is the default as
      # of 2026-09-12 - was litellm/text-embedding-3-small (API-dependent,
      # 1536-dim) as a leftover from before this fork shipped a working
      # local embedding backend. Confirmed live: real embeddings, real
      # semantic retrieval, real CTI reports, at zero added API cost.
      SF_EMBEDDING_PROVIDER: ${SF_EMBEDDING_PROVIDER:-fastembed}
      SF_EMBEDDING_MODEL: ${SF_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      SF_EMBEDDING_DIMENSIONS: ${SF_EMBEDDING_DIMENSIONS:-384}
      SF_EMBEDDING_API_KEY: ${SF_LLM_API_KEY}
      SF_EMBEDDING_API_BASE: ${SF_EMBEDDING_API_BASE:-http://litellm:4000}
      # How many indexed events a single report will analyse per scan -
      # confirmed live 2026-09-12 that a real active-recon scan can index
      # 600+ events, silently truncated to the old hardcoded 500 with no
      # way to raise it. Default kept at 500 for now; raise if needed.
      SF_REPORT_MAX_EVENTS_PER_SCAN: ${SF_REPORT_MAX_EVENTS_PER_SCAN:-500}
      # Reranker settings
      SF_RERANKER_PROVIDER: ${SF_RERANKER_PROVIDER:-litellm}
      SF_RERANKER_MODEL: ${SF_RERANKER_MODEL:-gpt-4o-mini}
      SF_RERANKER_API_KEY: ${SF_LLM_API_KEY}
      SF_RERANKER_API_BASE: ${SF_RERANKER_API_BASE:-http://litellm:4000}
      # OTEL tracing to Vector → Jaeger
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "spiderfoot-agents"
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["python", "-m", "spiderfoot.agents.service"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
        required: false     # agents start with mock LLM if litellm is not active
      qdrant:
        condition: service_started
        required: false     # agents start without RAG if qdrant is not active
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${AGENTS_CPUS:-2.0}"
          memory: "${AGENTS_MEMORY:-2G}"
    profiles:
    - ai
    - full

  # (The general-purpose celery worker - reports, exports, agents, monitoring,
  # everything except "scan" - is docker/compose/core.yml's celery-worker.
  # This used to describe a separate dedicated container for those queues;
  # consolidated into that single worker, comment left stale until now.)

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: sf-litellm
    restart: unless-stopped
    security_opt:
    - "no-new-privileges:true"
    read_only: true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - sf-frontend
    - sf-backend
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.litellm.rule=PathPrefix(`/litellm`)"
    - "traefik.http.routers.litellm.entrypoints=websecure"
    - "traefik.http.routers.litellm.tls=true"
    - "traefik.http.routers.litellm.middlewares=strip-litellm@file,security-headers@file"
    - "traefik.http.services.litellm.loadbalancer.server.port=4000"
    volumes:
    - ../../infra/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DATABASE_URL: 
        postgresql://${POSTGRES_USER:-spiderfoot}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # OTEL tracing to Vector
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "litellm"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\"\
          \ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${LITELLM_CPUS:-1.0}"
          memory: "${LITELLM_MEMORY:-1G}"
    profiles:
    - ai
    - full

  # (Jaeger, for distributed tracing, lives in docker/compose/monitor.yml.)

networks:
  sf-frontend:
    name: sf-frontend
    driver: bridge
  sf-backend:
    name: sf-backend
    driver: bridge
    internal: true

