name: Code Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Scope analysis to shipped product code (see config); excludes dev
          # scripts/tests/docs/frontend. Keeps full SAST coverage of the package
          # while avoiding an extractor parse error on a dev script that was
          # failing the code-scanning check.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

